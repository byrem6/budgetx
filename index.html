<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#e11d2e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)">
<meta name="description" content="Yatırım portföy takibi — altın, döviz, kripto ve diğer varlıklar. Microsoft Fluent tasarım dili ile mobil uygulama.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portföy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/css/app.css">
<title>Portföy · Yatırım Takip</title>
</head>
<body>

<!-- ======================= GİRİŞ EKRANI ======================= -->
<div id="loginHost" class="login" hidden></div>

<!-- ======================= UYGULAMA KABUĞU ======================= -->
<div class="shell" id="app">

  <!-- Sol gezinme rayı (masaüstü) -->
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 18.5 9 11l4 3.5L20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <b>Portföy</b>
        <small>Yatırım Takibi</small>
      </span>
    </div>
    <nav class="rail-nav" id="railNav" aria-label="Ana gezinme"></nav>
    <div class="rail-foot">
      <div class="rate-chip" id="rateChipRail"></div>
    </div>
  </aside>

  <!-- Ana bölge -->
  <div class="content">
    <header class="topbar">
      <button class="icon-btn rail-toggle" id="railToggle" aria-label="Menü" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="viewTitle">Genel Bakış</h1>
        <span id="viewSub" class="topbar-sub"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnSync" title="Bulut senkronizasyonu" aria-label="Bulut senkronizasyonu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 18a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18H7Z"/><path d="m9.5 13.5 2 2 4-4"/></svg>
        </button>
        <button class="icon-btn" id="btnSearch" title="Ara" aria-label="Ara">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btnNew" title="Yeni işlem" aria-label="Yeni işlem">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="btnMore" title="Menü" aria-label="Menü">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Alt sekme çubuğu (mobil) -->
  <nav class="tabbar" id="tabbar" aria-label="Alt gezinme"></nav>
</div>

<!-- Yüzen eylem düğmesi -->
<button class="fab" id="fab" aria-label="Yeni işlem ekle" title="Yeni işlem">
  <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- ======================= YÜKLENİYOR ======================= -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <span class="boot-spinner" aria-hidden="true"></span>
    <p>Portföy yükleniyor…</p>
  </div>
</div>

<div id="toastHost" class="toast-host" aria-live="polite"></div>
<div id="modalHost" class="modal-host" hidden></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
